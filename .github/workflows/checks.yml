name: Community checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lelab/src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lelab/src/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libglib2.0-0 libegl1 portaudio19-dev
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/constraints.txt -e './lelab/src[test]' 'lerobot[pi,smolvla]==0.7.0'
      - run: python -m pytest tests lelab/bridge lelab/src/tests/test_training_config.py lelab/src/tests/test_model_cache.py lelab/src/tests/test_rollout.py
        env:
          HF_HUB_OFFLINE: '1'
          LELAB_CACHE_ROOT: /tmp/lelab-puls-ci-cache
